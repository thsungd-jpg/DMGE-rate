<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DMGE — Freelance Rate Calculator</title>
    <meta name="description" content="Price your creative work with confidence: pick your craft, say who it is for, and get three honest prices, then turn one into an invoice." />
    <meta name="theme-color" content="#FFF6E8" />
    <meta property="og:title" content="DMGE — Freelance Rate Calculator" />
    <meta property="og:description" content="Know what your work is worth. Three honest prices in seconds, then an invoice." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <script>
      // set the saved/OS theme before first paint so night mode never flashes cream
      try {
        var qt = new URLSearchParams(location.search).get('theme');
        var t = (qt === 'dark' || qt === 'light') ? qt : localStorage.getItem('dmge-theme');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #FFF6E8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #05030D; }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { display: none; }
      body { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sorbet Ink type: Instrument Serif (editorial display, roman + italic), DM Sans (UI), DM Mono (figures). -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
